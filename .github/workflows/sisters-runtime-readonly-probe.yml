name: Sisters runtime readonly probe via Cartie deploy credential

on:
  push:
    branches:
      - ops/sisters-runtime-readonly-probe
    paths:
      - ".github/workflows/sisters-runtime-readonly-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Validate credential presence and format
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SERVER_HOST:-}" ] || { echo "server_host=missing"; exit 2; }
          [ -n "${SSH_PRIVATE_KEY:-}" ] || { echo "ssh_private_key=missing"; exit 2; }

          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_probe
          chmod 600 ~/.ssh/id_probe
          if ! ssh-keygen -y -f ~/.ssh/id_probe > ~/.ssh/id_probe.pub 2>/dev/null; then
            echo "ssh_private_key=invalid"
            exit 3
          fi
          echo "ssh_private_key=valid"
          echo "key_fingerprint=$(ssh-keygen -lf ~/.ssh/id_probe.pub | awk '{print $2}')"
          ssh-keyscan -T 8 -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Authenticate approved users and inventory Sisters runtime
        shell: bash
        run: |
          set -euo pipefail
          chosen=""
          for user in root ubuntu; do
            echo "auth-probe user=$user"
            if ssh -i ~/.ssh/id_probe \
              -o BatchMode=yes \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=8 \
              "$user@$SERVER_HOST" 'printf "auth=ok\\n"' >/tmp/auth.out 2>/tmp/auth.err; then
              cat /tmp/auth.out
              chosen="$user"
              break
            fi
            if grep -qi "Permission denied" /tmp/auth.err; then
              echo "result=publickey_rejected"
            elif grep -qiE "timed out|No route|Connection refused" /tmp/auth.err; then
              echo "result=transport_failure"
            else
              echo "result=other_failure"
            fi
          done

          [ -n "$chosen" ] || { echo "cartie_credential_auth=failed"; exit 42; }
          echo "cartie_credential_auth=ok"
          echo "authenticated_user=$chosen"

          ssh -i ~/.ssh/id_probe \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$chosen@$SERVER_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "===== HOST ====="
          hostname || true
          whoami || true
          date -u +%FT%TZ || true

          echo "===== SISTERS SERVICES ====="
          systemctl list-units --all --no-pager --plain 2>/dev/null \
            | grep -Ei 'sister|aroma|analytics|meta|ga4|bitrix|crm|airtable|attribut|capi' \
            | head -n 300 || true

          echo "===== SISTERS TIMERS ====="
          systemctl list-timers --all --no-pager --plain 2>/dev/null \
            | grep -Ei 'sister|aroma|analytics|meta|ga4|bitrix|crm|airtable|attribut|capi' \
            | head -n 300 || true

          echo "===== SIGNATURE FILE PATHS ONLY ====="
          patterns='highest_allocated_spend_v2|1705420460556907|appvrKdRRUt5isUVj|Sisters Aroma|sisters_aroma|sisters-aroma'
          for root in /srv /opt /root/nerd-method /root/nerd-claude-free-staging /root; do
            [ -d "$root" ] || continue
            if command -v rg >/dev/null 2>&1; then
              rg -Il --hidden --glob '!**/.git/**' --glob '!**/node_modules/**' \
                --glob '!**/.cache/**' --glob '!**/backups/**' \
                -e "$patterns" "$root" 2>/dev/null | head -n 700 || true
            else
              grep -RIlE --exclude-dir=.git --exclude-dir=node_modules \
                --exclude-dir=.cache --exclude-dir=backups \
                "$patterns" "$root" 2>/dev/null | head -n 700 || true
            fi
          done
          REMOTE
