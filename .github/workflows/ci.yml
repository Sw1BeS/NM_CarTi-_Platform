name: Cartie v2 CI

on:
  push:
    branches:
      - main
      - "candidate/**"
      - "qa/**"
      - "extract/**"
      - "import/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build (20.x)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cartie_ci
          POSTGRES_PASSWORD: cartie_ci
          POSTGRES_DB: cartie_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartie_ci -d cartie_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://cartie_ci:cartie_ci@localhost:5432/cartie_ci?schema=public
      NODE_ENV: test
      JWT_SECRET: ci_dummy_jwt_secret
      TELEGRAM_BOT_TOKEN: ci_dummy_telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET: ci_dummy_telegram_webhook_secret
      VITE_API_BASE_URL: http://localhost:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            apps/server/package-lock.json
            apps/web/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare CI database
        run: |
          until pg_isready -h localhost -p 5432 -U cartie_ci -d cartie_ci; do
            echo "Waiting for Postgres..."
            sleep 2
          done
          PGPASSWORD=cartie_ci psql -h localhost -p 5432 -U cartie_ci -d cartie_ci -c 'CREATE EXTENSION IF NOT EXISTS citext;'

      - name: Building Backend
        working-directory: ./apps/server
        run: |
          npm ci
          npm run prisma:generate
          npx prisma db push --skip-generate
          npm run build
          npm test

      - name: Building Frontend
        working-directory: ./apps/web
        run: |
          npm ci --legacy-peer-deps
          npm run build
